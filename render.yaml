services:
  - type: web
    name: tum-sepetim
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tum-sepetim-db
          property: connectionString

databases:
  - name: tum-sepetim-db
    databaseName: tum_sepetim
    user: tum_sepetim
