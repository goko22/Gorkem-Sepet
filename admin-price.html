<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Fiyat Yönetimi</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#090e15;color:#edf3f8;font-family:Arial,system-ui,sans-serif}
    .wrap{max-width:980px;margin:auto;padding:34px 18px 80px}.box,.item{background:#111925;border:1px solid #26364c;border-radius:16px}
    .box{padding:18px;margin-bottom:16px}h1{margin:0 0 8px}.muted{color:#93a2b5}.login{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:18px}
    input,button{border:1px solid #304159;border-radius:10px;padding:11px 12px;font-size:15px}input{background:#0b121c;color:#fff}button{background:#52d69a;color:#062016;font-weight:800;cursor:pointer}
    .danger{background:#35151c;color:#ff8490;border-color:#57232d}.list{display:grid;gap:10px}.item{padding:14px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
    .title{font-weight:800}.prices{font-size:13px;color:#93a2b5;margin-top:7px}.actions{display:flex;gap:7px;align-items:center}.actions input{width:140px}.status{min-height:22px;margin-top:12px;color:#9aabba}
    @media(max-width:700px){.login,.item{grid-template-columns:1fr}.actions{flex-wrap:wrap}.actions input{width:100%}}
  </style>
</head>
<body><main class="wrap">
  <section class="box">
    <h1>Gizli fiyat yönetimi</h1>
    <div class="muted">Bu sayfa ana sitede görünmez. Fiyat değişikliği için Render'daki ADMIN_PRICE_KEY gerekir.</div>
    <div class="login"><input id="key" type="password" autocomplete="off" placeholder="ADMIN_PRICE_KEY"><button id="unlock">Ürünleri aç</button></div>
    <div id="status" class="status"></div>
  </section>
  <section id="list" class="list"></section>
</main>
<script>
const keyEl=document.getElementById('key'), listEl=document.getElementById('list'), statusEl=document.getElementById('status');
const money=n=>n==null?'—':new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(n);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function getProducts(){const r=await fetch('/api/products');if(!r.ok)throw new Error('Ürünler alınamadı');return r.json()}
async function setPrice(id,price){const r=await fetch(`/api/admin/products/${id}/manual-price`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_key:keyEl.value,price})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'İşlem başarısız');return d}
async function clearPrice(id){const r=await fetch(`/api/admin/products/${id}/manual-price?admin_key=${encodeURIComponent(keyEl.value)}`,{method:'DELETE'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'İşlem başarısız');return d}
async function load(){if(!keyEl.value.trim()){statusEl.textContent='Önce şifreyi gir.';return} statusEl.textContent='Yükleniyor...'; const products=await getProducts(); listEl.innerHTML=''; for(const p of products){const el=document.createElement('article');el.className='item';el.innerHTML=`<div><div class="title">${esc(p.title)}</div><div class="prices">Aktif: ${money(p.source_price)} · Otomatik: ${money(p.auto_price)} · Manuel: ${money(p.manual_price)}</div></div><div class="actions"><input type="number" step="0.01" min="0.01" value="${p.manual_price??p.source_price??''}" data-price="${p.id}"><button data-save="${p.id}">Kaydet</button><button class="danger" data-clear="${p.id}">Manueli kaldır</button></div>`;listEl.appendChild(el)} bind();statusEl.textContent=`${products.length} ürün.`}
function bind(){document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.save;const inp=document.querySelector(`[data-price="${id}"]`);await setPrice(id,inp.value);statusEl.textContent='Manuel fiyat kaydedildi.';await load()}catch(e){statusEl.textContent=e.message}});document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=async()=>{try{await clearPrice(b.dataset.clear);statusEl.textContent='Manuel fiyat kaldırıldı; otomatik fiyata dönüldü.';await load()}catch(e){statusEl.textContent=e.message}})}
document.getElementById('unlock').onclick=()=>load().catch(e=>statusEl.textContent=e.message);keyEl.addEventListener('keydown',e=>{if(e.key==='Enter')load().catch(x=>statusEl.textContent=x.message)});
</script></body></html>
