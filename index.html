<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tüm Sepetim</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0a0f16;color:#edf3f8;font-family:Arial,system-ui,sans-serif}
    .wrap{max-width:1120px;margin:auto;padding:30px 18px 70px}
    h1{margin:0;font-size:34px}
    .sub{color:#91a0b2;margin:8px 0 24px}
    .panel,.stat,.product{background:#111925;border:1px solid #243247;border-radius:16px}
    .panel{padding:16px;margin-bottom:18px}
    .add{display:grid;grid-template-columns:1fr auto;gap:10px}
    input,button{border-radius:10px;border:1px solid #304159;padding:12px 13px;font-size:15px}
    input{background:#0b121c;color:#fff}
    button{background:#52d69a;color:#062016;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    .danger{background:#35151c;color:#ff8490;border-color:#57232d}
    .status{color:#a0adbb;min-height:22px;margin-top:10px}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
    .stat{padding:14px}.stat small{color:#91a0b2}.stat strong{display:block;font-size:24px;margin-top:5px}
    .list{display:grid;gap:10px}
    .product{padding:13px;display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:center}
    .thumb{width:86px;height:86px;object-fit:contain;background:#fff;border-radius:10px}
    .title{font-weight:700;margin-bottom:7px}.meta{font-size:14px;color:#91a0b2;margin-bottom:5px}
    .price{font-size:22px;font-weight:800;color:#72e7af;text-align:right}
    .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
    .actions button,.qty{padding:7px 9px;font-size:13px}.qty{width:68px}
    a{color:#8fc2ff;text-decoration:none}
    .empty{text-align:center;color:#91a0b2;padding:30px}
    @media(max-width:700px){
      .summary{grid-template-columns:1fr}
      .add{grid-template-columns:1fr}
      .product{grid-template-columns:68px 1fr}
      .thumb{width:68px;height:68px}
      .right{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
      .price{text-align:left}
    }
  </style>
</head>
<body>
<main class="wrap">
  <h1>Tüm Sepetim</h1>
  <div class="sub">Ürün linklerini tek sepette tut. Fiyat karşılaştırma motorunu adım adım büyüteceğiz.</div>

  <section class="panel">
    <div class="add">
      <input id="url" type="url" placeholder="Trendyol, Hepsiburada, Amazon, N11, Wraith... ürün linki">
      <button id="addBtn">Sepete ekle</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <section class="summary">
    <div class="stat"><small>Ürün çeşidi</small><strong id="count">0</strong></div>
    <div class="stat"><small>Sepet toplamı</small><strong id="total">₺0,00</strong></div>
    <div class="stat"><small>Sistem</small><strong>ONLINE</strong></div>
  </section>

  <section id="list" class="list"></section>
</main>

<script>
const listEl=document.getElementById("list");
const statusEl=document.getElementById("status");
const urlEl=document.getElementById("url");
const addBtn=document.getElementById("addBtn");
const countEl=document.getElementById("count");
const totalEl=document.getElementById("total");

const money=n=>n==null?"Fiyat alınamadı":new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY"}).format(n);

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function api(path,options={}){
  const r=await fetch(path,{headers:{"Content-Type":"application/json"},...options});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.detail||"İşlem başarısız.");
  return data;
}

async function load(){
  const products=await api("/api/products");
  render(products);
}

function render(products){
  listEl.innerHTML="";
  countEl.textContent=products.length;
  let total=0;

  if(!products.length){
    listEl.innerHTML='<div class="empty">Sepetin boş. Yukarıya bir ürün linki yapıştır.</div>';
  }

  for(const p of products){
    if(p.source_price!=null) total+=p.source_price*p.quantity;
    const el=document.createElement("article");
    el.className="product";
    el.innerHTML=`
      <img class="thumb" src="${esc(p.image_url||"")}" alt="" onerror="this.style.visibility='hidden'">
      <div>
        <div class="title">${esc(p.title)}</div>
        <div class="meta">${esc(p.source_store)} · ${p.quantity} adet</div>
        <a href="${esc(p.source_url)}" target="_blank" rel="noopener">Mağazada aç</a>
      </div>
      <div class="right">
        <div class="price">${money(p.source_price)}</div>
        <div class="actions">
          <input class="qty" type="number" min="1" max="99" value="${p.quantity}" data-id="${p.id}">
          <button class="danger del" data-id="${p.id}">Sil</button>
        </div>
      </div>`;
    listEl.appendChild(el);
  }

  totalEl.textContent=money(total);

  document.querySelectorAll(".del").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      try{
        await api("/api/products/"+btn.dataset.id,{method:"DELETE"});
        await load();
      }catch(e){statusEl.textContent=e.message}
    });
  });

  document.querySelectorAll(".qty").forEach(inp=>{
    inp.addEventListener("change",async()=>{
      try{
        await api(`/api/products/${inp.dataset.id}/quantity?quantity=${encodeURIComponent(inp.value)}`,{method:"PATCH"});
        await load();
      }catch(e){statusEl.textContent=e.message}
    });
  });
}

async function add(){
  const url=urlEl.value.trim();
  if(!url){statusEl.textContent="Önce ürün linki yapıştır.";return}
  addBtn.disabled=true;
  statusEl.textContent="Ürün bilgileri alınıyor...";
  try{
    await api("/api/products",{method:"POST",body:JSON.stringify({url,quantity:1})});
    urlEl.value="";
    statusEl.textContent="Ürün sepete eklendi.";
    await load();
  }catch(e){
    statusEl.textContent=e.message;
  }finally{
    addBtn.disabled=false;
  }
}

addBtn.addEventListener("click",add);
urlEl.addEventListener("keydown",e=>{if(e.key==="Enter")add()});
load().catch(e=>statusEl.textContent=e.message);
</script>
</body>
</html>
